name: CI (frontend)

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-vanguard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-vanguard/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high
